# Sapphire OS — XFCE glassmorphism profile
backend = "glx";
vsync = true;
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.48;
shadow-offset-x = -9;
shadow-offset-y = -9;
corner-radius = 12;
inactive-opacity = 0.92;
active-opacity = 0.97;
frame-opacity = 0.88;
inactive-opacity-override = false;
blur = { method = "dual_kawase"; strength = 7; background = true; background-frame = true; background-fixed = false; };
blur-background-exclude = [ "window_type = 'desktop'" ];
shadow-exclude = [ "window_type = 'desktop'" ];
