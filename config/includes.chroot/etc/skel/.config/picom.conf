# Obsidian OS — XFCE glassmorphism profile
backend = "glx";
vsync = true;

# Soft window shadows and rounded edges
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.48;
shadow-offset-x = -9;
shadow-offset-y = -9;
corner-radius = 12;

# Subtle transparency
inactive-opacity = 0.92;
active-opacity = 0.97;
frame-opacity = 0.88;
inactive-opacity-override = false;

# Frosted-glass background blur
blur = {
  method = "dual_kawase";
  strength = 7;
  background = true;
  background-frame = true;
  background-fixed = false;
};

# Keep desktop wallpaper and panels crisp; soften menus and dock surfaces
blur-background-exclude = [
  "window_type = 'desktop'",
  "class_g = 'Plank'"
];
shadow-exclude = [
  "window_type = 'desktop'",
  "class_g = 'Plank'"
];
