name: Build Obsidian OS ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: obsidian-os-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Free runner disk space
        run: |
          df -h
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/share/powershell /usr/local/share/chromium \
            /usr/local/lib/node_modules
          sudo apt-get clean
          df -h
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            live-build debootstrap xorriso squashfs-tools \
            grub-pc-bin grub-efi-amd64-bin grub2-common isolinux syslinux-common \
            dosfstools mtools rsync git curl wget file python3
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare permissions
        run: |
          chmod +x build-iso.sh scripts/validate-iso.sh config/hooks/normal/*.hook.chroot
      - name: Build ISO
        env:
          OBSIDIAN_VERSION: 0.1.0
        run: sudo env OBSIDIAN_VERSION="$OBSIDIAN_VERSION" ./build-iso.sh
      - name: Validate ISO boot catalog and checksum
        run: |
          ISO="$(find output -maxdepth 1 -name '*.iso' -print -quit)"
          test -n "$ISO"
          sudo ./scripts/validate-iso.sh "$ISO"
          test -s "${ISO}.sha256"
      - name: Upload ISO and checksum
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-os-0.1.0-amd64-iso
          path: |
            output/*.iso
            output/*.sha256
          if-no-files-found: error
          retention-days: 7
