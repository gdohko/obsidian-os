name: Build Obsidian OS ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check runner disk space
        run: |
          df -h
          sudo apt-get clean
          df -h
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            live-build debootstrap xorriso squashfs-tools \
            grub-pc-bin grub-efi-amd64-bin grub2-common isolinux syslinux-common \
            dosfstools mtools rsync git curl wget file python3
      - name: Validate shell scripts
        run: |
          bash -n build-iso.sh
          bash -n scripts/validate-iso.sh
      - name: Build ISO
        env:
          OBSIDIAN_VERSION: 0.1.0
        run: sudo env OBSIDIAN_VERSION=0.1.0 bash ./build-iso.sh
      - name: Validate ISO
        run: |
          ISO="$(find output -maxdepth 1 -type f -name '*.iso' -print -quit)"
          test -n "$ISO"
          sudo bash ./scripts/validate-iso.sh "$ISO"
          test -s "${ISO}.sha256"
          sha256sum --check "${ISO}.sha256"
          file "$ISO"
      - name: Upload ISO and checksum
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-os-0.1.0-amd64-iso
          path: |
            output/*.iso
            output/*.sha256
          if-no-files-found: error
          retention-days: 7
