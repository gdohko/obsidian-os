name: Build Sapphire OS ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check runner disk space
        run: |
          df -h
          sudo apt-get clean
          df -h
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debian-archive-keyring debootstrap xorriso squashfs-tools \
            grub-pc-bin grub-efi-amd64-bin grub2-common \
            dosfstools mtools rsync git curl wget file python3
          echo "deb [signed-by=/usr/share/keyrings/debian-archive-keyring.gpg] https://deb.debian.org/debian trixie main" | sudo tee /etc/apt/sources.list.d/debian-live-build.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends live-build=1:20250505+deb13u1
          sudo rm -f /etc/apt/sources.list.d/debian-live-build.list
      - name: Validate shell scripts
        run: |
          bash -n build-iso.sh
          bash -n scripts/validate-iso.sh
      - name: Build ISO
        env:
          SAPPHIRE_VERSION: 0.1.0
        run: sudo env SAPPHIRE_VERSION=0.1.0 bash ./build-iso.sh
      - name: Validate ISO
        run: |
          ISO="$(find output -maxdepth 1 -type f -name '*.iso' -print -quit)"
          test -n "$ISO"
          sudo bash ./scripts/validate-iso.sh "$ISO"
          test -s "${ISO}.sha256"
          (cd output && sha256sum --check "$(basename "$ISO").sha256")
          file "$ISO"
      - name: Upload ISO and checksum
        uses: actions/upload-artifact@v4
        with:
          name: sapphire-os-0.1.0-amd64-iso
          path: |
            output/*.iso
            output/*.sha256
          if-no-files-found: error
          retention-days: 7
